<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Závady vozů</title>
  <meta name="description" content="Evidence závad železničních vozů" />
  <meta name="theme-color" content="#1f4e8c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=2" />
  <!-- Soubory aplikace se načítají s razítkem v adrese (?r=…), které se změní při znovunačtení po aktualizaci
       (reloadApp v js/ui.js). iPhone by jinak po „Aktualizovat“ spustil znovu staré skripty ze své paměti,
       dokud se aplikace úplně nezavře. Moduly mezi sebou dostanou razítko přes import map.
       Všechny části aplikace se stáhnou najednou (modulepreload), jinak by se načítaly postupně jedna po druhé. -->
  <script>
    (() => {
      let r = '';
      try {
        r = localStorage.getItem('app-reload') || String(Date.now());
        localStorage.setItem('app-reload', r);
      } catch {}
      const q = r ? `?r=${r}` : '';
      const mq = HTMLScriptElement.supports?.('importmap') ? q : ''; // starší Safari: moduly bez razítka
      const modules = ['js/app.js', 'js/config.js', 'js/model.js', 'js/codes.js', 'js/ui.js', 'js/version.js',
        'js/outbox.js', 'js/draft.js', 'js/history.js', 'js/offline.js', 'js/xlsx.js', 'js/api/index.js', 'js/api/supabase.js',
        'js/api/demo.js', 'js/views/account.js', 'js/views/admin.js', 'js/views/codes.js', 'js/views/defect.js',
        'js/views/form.js', 'js/views/groups.js', 'js/views/overview.js', 'js/views/regulations.js',
        'js/views/wagon.js', 'js/views/scanner.js', 'js/light.js', 'js/ocr.js', 'js/ort.js', 'vendor/preact-htm.js'];
      // načítají se až při použití (skener čísla vozu až po klepnutí na kameru u čísla)
      const lazy = ['js/xlsx.js', 'js/api/demo.js', 'js/views/scanner.js', 'js/light.js', 'js/ocr.js', 'js/ort.js'];
      const imports = Object.fromEntries(modules.map((m) => [`./${m}`, `./${m}${mq}`]));
      document.write(`<link rel="stylesheet" href="css/app.css${q}">`
        + `<script type="importmap">${JSON.stringify({ imports })}<\/script>`
        + modules.filter((m) => !lazy.includes(m)).map((m) => `<link rel="modulepreload" href="${m}${mq}">`).join('')
        + `<script defer src="vendor/supabase.js${q}"><\/script>`
        + `<script type="module">import './js/app.js';<\/script>`);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>Aplikace potřebuje zapnutý JavaScript.</noscript>
</body>
</html>
